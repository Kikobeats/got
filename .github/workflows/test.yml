name: test

on:
  push:
    branches: [v11]
  pull_request:
    branches: [v11]

env:
  DEPENDENCIES_BEFORE: '2021-06-15'
  TYPES_NODE_VERSION: '14.18.34'

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [lts/*, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --version
      - name: Install
        run: |
          npm install --ignore-scripts --before=$DEPENDENCIES_BEFORE
          npm install --ignore-scripts --no-save @types/node@$TYPES_NODE_VERSION
      - name: Build
        run: npm run build
      - name: Test
        run: npx ava test/retry.ts

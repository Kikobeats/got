name: test

on:
  push:
    branches: [v11]
  pull_request:
    branches: [v11]

env:
  DEV_DEPENDENCIES_BEFORE: '2021-06-15'
  PEM_VERSION: '1.14.8'
  TYPES_NODE_VERSION: '14.18.34'

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [lts/*, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --version && openssl version
      - name: Install dev dependencies
        run: npm install --ignore-scripts --before=$DEV_DEPENDENCIES_BEFORE
      - name: Install latest runtime dependencies in range
        run: |
          RUNTIME_DEPENDENCIES=$(node -p "Object.entries(require('./package.json').dependencies).map(([name, range]) => name + '@' + range).join(' ')")
          npm install --ignore-scripts --no-save $RUNTIME_DEPENDENCIES pem@$PEM_VERSION @types/node@$TYPES_NODE_VERSION
      - name: Build
        run: npm run build
      - name: Test
        run: npx ava
